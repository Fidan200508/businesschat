services:
  # Backend API Service
  - type: web
    name: loan-business-api
    runtime: docker
    dockerFilePath: backend.Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        sync: false   # Set manually in Render dashboard — must be a long random string
      - key: ENCRYPTION_KEY
        sync: false   # Set manually in Render dashboard — generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: FRONTEND_ORIGIN
        fromService:
          name: loan-business-frontend
          type: web
          property: url

  # Frontend Static Site
  - type: web
    name: loan-business-frontend
    runtime: docker
    dockerFilePath: frontend.Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: loan-business-api
          type: web
          property: url
      - key: VITE_WS_URL
        fromService:
          name: loan-business-api
          type: web
          property: url
        # Note: Render gives https:// URLs — ChatBot.jsx already converts https→wss automatically.
