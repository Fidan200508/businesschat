databases:
  - name: loan-business-db
    plan: free
    databaseName: loan_business
    user: loan_business_user

services:
  # Backend API service
  - type: web
    name: loan-business-api
    runtime: docker
    dockerfilePath: backend.Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: loan-business-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

  # Frontend web service
  - type: web
    name: loan-business-frontend
    runtime: docker
    dockerfilePath: frontend.Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 80
