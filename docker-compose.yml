version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env   # Loads SECRET_KEY, ENCRYPTION_KEY, ALGORITHM, etc. from local .env
    environment:
      - PORT=8000
      - FRONTEND_ORIGIN=http://localhost:80
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - VITE_API_URL=http://your_droplet_ip:8000
        - VITE_WS_URL=http://your_droplet_ip:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
